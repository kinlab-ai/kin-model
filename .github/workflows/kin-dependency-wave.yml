name: Kin Dependency Wave

on:
  repository_dispatch:
    types: [kin-registry-release]
  workflow_dispatch:
  schedule:
    # Daily rather than every 6 hours: a quarter of the 6-hourly runs failed,
    # and a dependency pin does not need to move four times a day.
    - cron: "29 5 * * *"

jobs:
  dependency-wave:
    permissions:
      contents: write
      pull-requests: write
    uses: firelock-ai/kin-actions/.github/workflows/cargo-dependency-wave.yml@v0.1.32
    with:
      manifests: Cargo.toml
      test-command: cargo test
      auto-merge: true
    secrets:
      KIN_CI_BOT_TOKEN: ${{ secrets.KIN_DOWNSTREAM_DISPATCH_TOKEN }}
